spring.application.name=Tomorang

# =========================
# ?? ??
# =========================
server.port=8081
# ?? ???? (?? sever -> server? ?? ??)
server.servlet.session.timeout=2h

# =========================
# MySQL & MyBatis ??
# =========================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://localhost:3306/Tomorang?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=root
spring.datasource.password=1111

# MyBatis (??? mybatis? ???? ?? ?????)
mybatis.mapper-locations=classpath*:mybatis/mapper/**/*.xml
mybatis.type-aliases-package=com.example.dto
mybatis.configuration.map-underscore-to-camel-case=true

# =========================
# ?? ??? ??
# =========================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# =========================
# Swagger (OpenAPI) ??
# =========================
# Swagger UI ?? ??: http://localhost:8081/swagger-ui.html
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs

logging.level.org.springframework.web.socket=DEBUG
logging.level.com.example.chat=DEBUG
java.runtime.version=17