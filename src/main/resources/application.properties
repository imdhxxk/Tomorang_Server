# =========================
# Spring Application
# =========================
spring.application.name=Tomorang

# =========================
# 서버 설정
# =========================
server.port=${PORT:8081}
server.servlet.session.timeout=2h

# =========================
# MySQL & MyBatis
# =========================
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver
spring.datasource.url=jdbc:mysql://${MYSQL_HOST:localhost}:${MYSQL_PORT:3306}/${MYSQL_DATABASE:Tomorang}?serverTimezone=Asia/Seoul&characterEncoding=UTF-8
spring.datasource.username=${MYSQL_USER:root}
spring.datasource.password=${MYSQL_PASSWORD:1111}

mybatis.mapper-locations=classpath*:mybatis/mapper/**/*.xml
mybatis.type-aliases-package=kr.hs.after.Tomorang.DTO
mybatis.configuration.map-underscore-to-camel-case=true

# =========================
# 파일 업로드 설정
# =========================
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=20MB

# =========================
# Swagger (OpenAPI)
# =========================
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.api-docs.path=/api-docs
springdoc.default-consumes-media-type=multipart/form-data
springdoc.default-produces-media-type=application/json
springdoc.swagger-ui.operations-sorter=alpha
springdoc.swagger-ui.tags-sorter=alpha

# =========================
# Logging
# =========================
logging.level.org.springframework.web.socket=DEBUG
logging.level.com.example.chat=DEBUG
java.runtime.version=17

# =========================
# AWS S3
# =========================
cloud.aws.s3.bucket=${AWS_S3_BUCKET:tomorang-storage}
cloud.aws.region.static=${AWS_REGION:ap-northeast-2}
cloud.aws.credentials.access-key=${AWS_ACCESS_KEY}
cloud.aws.credentials.secret-key=${AWS_SECRET_KEY}
cloud.aws.stack.auto=false

# =========================
# JWT
# =========================
jwt.secret=${JWT_SECRET}

# =========================
# DeepL Translation API
# =========================
deepl.api-key=${DEEPL_API_KEY}
